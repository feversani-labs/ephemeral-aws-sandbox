name: "Terraform Deployment"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        env:
          TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_environment: ${{ vars.ENVIRONMENT }}
          TF_VAR_owner: ${{ vars.OWNER }}
          TF_VAR_region: ${{ vars.REGION }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_environment: ${{ vars.ENVIRONMENT }}
          TF_VAR_owner: ${{ vars.OWNER }}
          TF_VAR_region: ${{ vars.REGION }}

      - name: Summary & SSM Parameter Info
        run: |
          BUCKET=$(terraform output -raw bucket_name)
          SSM_PARAM=$(terraform output -raw ssm_parameter_name)
          REGION="${{ vars.REGION }}"

          echo "### 🚀 Sandbox State Bucket Creado con Éxito" >> $GITHUB_STEP_SUMMARY
          echo "- **Bucket S3:** \`$BUCKET\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Parámetro SSM:** \`$SSM_PARAM\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Región:** \`$REGION\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 🤖 Consumo 100% Automático en otros repositorios (sin copiar y pegar):" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# En el workflow del otro repositorio antes de terraform init:" >> $GITHUB_STEP_SUMMARY
          echo "BUCKET=\$(aws ssm get-parameter --name \"$SSM_PARAM\" --query \"Parameter.Value\" --output text)" >> $GITHUB_STEP_SUMMARY
          echo "terraform init -backend-config=\"bucket=\$BUCKET\" -backend-config=\"key=mi-repo/terraform.tfstate\" -backend-config=\"region=$REGION\"" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
