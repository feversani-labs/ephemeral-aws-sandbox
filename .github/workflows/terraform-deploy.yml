name: "Terraform Deployment"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        env:
          TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_environment: ${{ vars.ENVIRONMENT }}
          TF_VAR_owner: ${{ vars.OWNER }}
          TF_VAR_region: ${{ vars.REGION }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_environment: ${{ vars.ENVIRONMENT }}
          TF_VAR_owner: ${{ vars.OWNER }}
          TF_VAR_region: ${{ vars.REGION }}

      - name: Summary & Backend Snippet
        run: |
          BUCKET=$(terraform output -raw bucket_name)
          REGION="${{ vars.REGION }}"
          echo "### 🚀 Bucket de Estado Creado con Éxito" >> $GITHUB_STEP_SUMMARY
          echo "- **Nombre del Bucket:** \`$BUCKET\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Región:** \`$REGION\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📋 Configuración de backend para otros repositorios:" >> $GITHUB_STEP_SUMMARY
          echo '```hcl' >> $GITHUB_STEP_SUMMARY
          echo 'terraform {' >> $GITHUB_STEP_SUMMARY
          echo '  backend "s3" {' >> $GITHUB_STEP_SUMMARY
          echo "    bucket = \"$BUCKET\"" >> $GITHUB_STEP_SUMMARY
          echo '    key    = "ruta/a/tu/terraform.tfstate"' >> $GITHUB_STEP_SUMMARY
          echo "    region = \"$REGION\"" >> $GITHUB_STEP_SUMMARY
          echo '  }' >> $GITHUB_STEP_SUMMARY
          echo '}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Summary & Backend Snippet
        run: |
          BUCKET=$(terraform output -raw bucket_name)
          REGION="${{ vars.REGION }}"
          echo "### 🚀 Bucket de Estado Creado con Éxito" >> $GITHUB_STEP_SUMMARY
          echo "- **Nombre del Bucket:** \`$BUCKET\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Región:** \`$REGION\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📋 Configuración de backend para otros repositorios:" >> $GITHUB_STEP_SUMMARY
          echo '```hcl' >> $GITHUB_STEP_SUMMARY
          echo 'terraform {' >> $GITHUB_STEP_SUMMARY
          echo '  backend "s3" {' >> $GITHUB_STEP_SUMMARY
          echo "    bucket = \"$BUCKET\"" >> $GITHUB_STEP_SUMMARY
          echo '    key    = "ruta/a/tu/terraform.tfstate"' >> $GITHUB_STEP_SUMMARY
          echo "    region = \"$REGION\"" >> $GITHUB_STEP_SUMMARY
          echo '  }' >> $GITHUB_STEP_SUMMARY
          echo '}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
